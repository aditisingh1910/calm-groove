<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Login — Calm Grove</title>
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;700&family=Poppins:wght@600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <header class="site-header">
            <div class="nav-wrap">
                <h1 class="logo">Calm Grove</h1>
                <nav>
                    <a href="index.html">Home</a>
                </nav>
            </div>
        </header>

        <main>
            <section class="hero">
                <div class="hero-content">
                    <h2>Welcome Back</h2>
                    <p>Sign in to access your personal journal.</p>
                    <div id="auth-section">
                        <input type="tel" id="phone" placeholder="Phone number" required>
                        <input type="password" id="password" placeholder="Password" required>
                        <button id="signup-btn" class="btn">Sign Up</button>
                        <button id="login-btn-modal" class="btn light">Log In</button>
                    </div>
                </div>
            </section>
        </main>

        <footer class="site-footer">
            <p>Made with care • Breathe deeply • © Calm Grove</p>
        </footer>

        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script src="login.js"></script>
    </body>
</html>
